<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="סטופר">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>סטופר</title>
<style>
  :root {
    --bg: #000; --fg: #fff; --dim: #8e8e93;
    --red: #ff453a; --red-bg: #330e0c;
    --gray-bg: #333336;
    --wine-1: #7f2a3b; --wine-2: #5c1a28; --wine-3: #3a0d17; --wine-text: #fde6ea;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
  }
  body {
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7vh; position: relative; padding: 0 16px; }

  #display {
    direction: ltr; font-weight: 200; font-variant-numeric: tabular-nums; font-feature-settings: "tnum";
    font-size: min(20vw, 34vh, 130px); letter-spacing: -0.02em; line-height: 1; white-space: nowrap;
  }
  #countdown { font-weight: 200; font-variant-numeric: tabular-nums; font-size: min(60vw, 50vh); line-height: 1; }
  #hint { color: var(--dim); font-size: 17px; min-height: 1.3em; text-align: center; justify-content: center; }

  /* iOS-style round buttons (fill, black gap, outer ring) */
  .btn {
    --c: var(--fg); --b: var(--gray-bg);
    width: 96px; height: 96px; border-radius: 50%; border: 0;
    background: var(--b); color: var(--c);
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--b);
    font: inherit; font-size: 18px; font-weight: 400; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .btn:active { opacity: .7; }
  .btn.red  { --c: var(--red); --b: var(--red-bg); }
  .btn.gray { --c: #fff; --b: var(--gray-bg); }

  /* Big Start button: soft bordeaux with depth, SF Pro Rounded (Apple Fitness style) */
  #startBtn {
    --size: min(70vw, 42vh, 300px);
    width: var(--size); height: var(--size); border-radius: 50%; border: 0; cursor: pointer;
    align-items: center; justify-content: center;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, "SF Pro Display", system-ui, sans-serif;
    font-size: calc(var(--size) * 0.18); font-weight: 600; letter-spacing: 0.01em; color: var(--wine-text);
    background:
      radial-gradient(circle at 50% 22%, rgba(255,255,255,.16), rgba(255,255,255,0) 45%),
      radial-gradient(circle at 50% 40%, var(--wine-1) 0%, var(--wine-2) 58%, var(--wine-3) 100%);
    box-shadow:
      inset 0 2px 1px rgba(255,255,255,.22),
      inset 0 -10px 24px rgba(0,0,0,.45),
      0 0 0 6px #000,
      0 0 0 8px rgba(154,52,72,.55),
      0 24px 60px rgba(154,52,72,.28),
      0 10px 24px rgba(0,0,0,.6);
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
    transition: transform .12s ease, filter .12s ease;
  }
  #startBtn:active { transform: scale(.965); filter: brightness(.92); }
  #startBtn[disabled] { opacity: .5; }

  /* Settings (idle screen) */
  #settings { position: absolute; bottom: 20px; left: 16px; right: 16px; flex-direction: column; gap: 14px; align-items: center; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; max-width: 360px; color: var(--dim); font-size: 15px; }
  .seg { display: flex; background: #1c1c1e; border-radius: 9px; padding: 2px; direction: ltr; }
  .seg button {
    border: 0; background: transparent; color: #fff; font: inherit; font-size: 14px; font-variant-numeric: tabular-nums;
    min-width: 50px; padding: 6px 10px; border-radius: 7px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: #636366; box-shadow: 0 3px 8px rgba(0,0,0,.25); }

  #tapZone { position: fixed; inset: 0; z-index: 10; display: none; }

  /* State-driven visibility */
  .v { display: none !important; }
  body[data-state="idle"] .v-idle,
  body[data-state="countdown"] .v-countdown,
  body[data-state="running"] .v-running,
  body[data-state="stopped"] .v-stopped { display: flex !important; }
  body[data-state="countdown"] #tapZone, body[data-state="running"] #tapZone { display: block; }
</style>
</head>
<body data-state="idle">
<main>
  <div id="countdown" class="v v-countdown">3</div>
  <div id="display" class="v v-running v-stopped">00:00.00</div>
  <button id="startBtn" class="v v-idle" lang="en" disabled>Start</button>
  <button id="stopBtn" class="btn red v v-running v-countdown" lang="en" tabindex="-1">Stop</button>
  <button id="resetBtn" class="btn gray v v-stopped" lang="en">Reset</button>
  <div id="hint" class="v v-running v-countdown v-stopped"></div>
  <div id="settings" class="v v-idle">
    <div class="row"><span>הקראת זמן כל (שניות)</span><div class="seg" id="intervalSeg"></div></div>
  </div>
</main>
<div id="tapZone"></div>

<script>
/* ===================================================================
   Audio design
   - voice/pack.bin holds every clip as constant-size MP3 frames
     (144 bytes = 24 ms each, no bit reservoir), so frames splice freely.
   - On the idle screen we pre-build ONE continuous MP3 for the whole run:
     3 beeps, "מתחילים" at 0:00, and every callout at its exact frame.
   - Start plays that single file. No file switches or seeks while running,
     so callout timing is fixed by the audio clock alone and nothing heavy
     runs on the main thread during the run.
   - The display clock is locked to the audio position (sampled each frame,
     earliest-estimate filter), so what you see matches what you hear.
   - iOS keeps an <audio> element playing when the screen locks.
   Texts/language live in tools/make_voice.py; here we only pick clip ids.
   =================================================================== */
const INTERVALS = [5, 10, 30, 60];
const MAX_MIN = 90;
const FR = 144, FS = 576 / 24000;   // bytes and seconds per MP3 frame
const SHIFT = 2;                    // frames: compensates the ~47 ms MP3 encoder delay
const FILE_SEC = 3600;              // one audio file covers an hour of callouts
const UI = {
  tapToStop: 'הקש בכל מקום כדי לעצור',
  tapToCancel: 'הקש כדי לבטל',
  tapToResume: 'הקש כדי לחדש את ההקראות',
  nowPlaying: 'סטופר רץ',
  lockHint: 'עצירה = הקראת הזמן',
};
function calloutIds(t) {            // t = seconds since "מתחילים"
  const m = Math.floor(t / 60), s = t % 60;
  if (m === 0) return ['n' + s];
  if (m > MAX_MIN) return [];
  return s ? ['m' + m, 'a' + s] : ['m' + m];
}
function finalIds(t) {              // t = whole seconds
  const m = Math.floor(t / 60), s = t % 60;
  if (m === 0 || m > MAX_MIN) return s ? ['s' + s] : ['zero'];
  return s ? ['m' + m, 'as' + s] : ['m' + m];
}

/* ---------------- Storage ---------------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let interval = store.get('interval', 10); if (!INTERVALS.includes(interval)) interval = 10;

/* ---------------- Elements ---------------- */
const $ = id => document.getElementById(id);
const body = document.body, display = $('display'), cdEl = $('countdown'), hint = $('hint'), startBtn = $('startBtn');
const seg = $('intervalSeg');
function renderSeg() {
  seg.innerHTML = '';
  for (const v of INTERVALS) {
    const b = document.createElement('button');
    b.textContent = String(v);
    b.setAttribute('aria-pressed', String(v === interval));
    b.addEventListener('click', () => { if (v === interval) return; interval = v; store.set('interval', v); renderSeg(); prebuild(); });
    seg.appendChild(b);
  }
}
renderSeg();

/* ---------------- Voice pack + MP3 splicing ---------------- */
let pack = null, index = null;
function bytesOf(id) { const e = index[id]; return e ? pack.subarray(e[0] * FR, (e[0] + e[1]) * FR) : null; }
function framesOf(id) { const e = index[id]; return e ? e[1] : 0; }

// events: [{at: seconds in file, ids: [...]}] (sorted). Returns a blob URL of one continuous MP3.
function buildMp3(totalSec, events) {
  const sil = bytesOf('silence'), silN = framesOf('silence');
  const parts = []; let f = 0;
  const pad = to => { while (f < to) { const k = Math.min(to - f, silN); parts.push(k === silN ? sil : sil.subarray(0, k * FR)); f += k; } };
  for (const ev of events) {
    pad(Math.round(ev.at / FS) - SHIFT);
    for (const id of ev.ids) { const b = bytesOf(id); if (b) { parts.push(b); f += framesOf(id); } }
  }
  pad(Math.round(totalSec / FS));
  return URL.createObjectURL(new Blob(parts, { type: 'audio/mpeg' }));
}
// Audio-time: 0 = first beep, 3 = "מתחילים" (0:00 on the display). A file starts at audio-time `from`.
function buildRunFile(from) {
  const I = interval, events = [];
  if (from === 0) events.push({ at: 0, ids: ['beep'] }, { at: 1, ids: ['beep'] }, { at: 2, ids: ['beep'] }, { at: 3, ids: ['go'] });
  for (let k = Math.max(1, Math.ceil((from - 3) / I)); 3 + k * I < from + FILE_SEC; k++) {
    if (3 + k * I < from) continue;
    events.push({ at: 3 + k * I - from, ids: calloutIds(k * I) });
  }
  return buildMp3(FILE_SEC + (from === 0 ? 3 : 0), events);
}
let runUrl = null, runUrlFor = null;
function prebuild() {
  if (!pack) return;
  if (runUrl) URL.revokeObjectURL(runUrl);
  runUrl = buildRunFile(0); runUrlFor = interval;
}

(async function loadPack() {
  try {
    const [bin, idx] = await Promise.all([
      fetch('voice/pack.bin').then(r => r.arrayBuffer()),
      fetch('voice/pack.json').then(r => r.json()),
    ]);
    pack = new Uint8Array(bin); index = idx;
    prebuild();
    if (state === 'idle') startBtn.disabled = false;
  } catch (e) {}
})();

/* ---------------- Player ---------------- */
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
const player = new Audio();
player.preload = 'auto';
player.setAttribute('playsinline', '');
let fileKind = null;        // 'run' | 'final'
let fileFrom = 0;           // audio-time (s) at which the current run file starts
let pendingSeek = null, needsResume = false;

function playFile(url, kind, from, seekTo) {
  fileKind = kind; fileFrom = from; pendingSeek = seekTo;
  player.src = url;
  const p = player.play();
  if (p) p.catch(err => { if (err && err.name === 'NotAllowedError' && state === 'running') { needsResume = true; hint.textContent = UI.tapToResume; } });
}
player.addEventListener('loadedmetadata', () => {
  if (pendingSeek != null) { try { player.currentTime = pendingSeek; } catch (e) {} pendingSeek = null; }
});
player.addEventListener('ended', () => {
  if (fileKind === 'run' && state === 'running') {         // next hour
    const from = fileFrom + FILE_SEC + (fileFrom === 0 ? 3 : 0);
    playFile(buildRunFile(from), 'run', from, Math.max(0, audioNow() - from));
    return;
  }
  player.pause(); clearMedia();
});

/* ---------------- Clock locked to the audio ----------------
   audioZero = wall-clock ms at which audio-time 0 played. Estimate from
   now − currentTime; stale currentTime readings only make the estimate later,
   so the minimum over a window is the best one. */
let audioZero = 0, syncSamples = 0, winMin = Infinity, winStart = 0;
const audioNow = () => (Date.now() - audioZero) / 1000;   // seconds of audio-time
function sampleSync(now) {
  if (fileKind !== 'run' || player.paused || player.seeking || pendingSeek != null) return;
  const ct = player.currentTime;
  if (ct < 0.05) return;
  const est = now - (fileFrom + ct) * 1000;
  if (state === 'countdown') {                      // converge fast during the countdown
    audioZero = syncSamples++ === 0 ? est : Math.min(audioZero, est);
    return;
  }
  winMin = Math.min(winMin, est);
  if (now - winStart > 1500) {
    if (winMin !== Infinity) {
      const d = winMin - audioZero;
      if (Math.abs(d) > 400) { try { player.currentTime = (now - audioZero) / 1000 - fileFrom; } catch (e) {} }  // audio stalled: catch it up
      else if (Math.abs(d) > 15) audioZero += d * 0.3;                                                        // tiny drift: follow the audio
    }
    winMin = Infinity; winStart = now;
  }
}

/* ---------------- Lock-screen controls ---------------- */
function setMedia() {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: UI.nowPlaying, artist: UI.lockHint,
      artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }],
    });
    navigator.mediaSession.setActionHandler('pause', () => stop());
    navigator.mediaSession.setActionHandler('play', () => { player.play().catch(() => {}); });
    try { navigator.mediaSession.setActionHandler('stop', () => stop()); } catch (e) {}
    for (const a of ['seekbackward', 'seekforward', 'previoustrack', 'nexttrack', 'seekto']) try { navigator.mediaSession.setActionHandler(a, null); } catch (e) {}
  } catch (e) {}
}
function clearMedia() { try { if ('mediaSession' in navigator) navigator.mediaSession.metadata = null; } catch (e) {} }

/* ---------------- State machine ---------------- */
let state = 'idle';
let raf = 0, stoppedAt = 0, lastText = '', lastCd = '';
function setState(s) { state = s; body.dataset.state = s; }
const runStart = () => audioZero + 3000;

function fmt(ms) {
  const cs = Math.floor(Math.max(0, ms) / 10);
  const m = Math.floor(cs / 6000), s = Math.floor(cs / 100) % 60, c = cs % 100;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + String(c).padStart(2, '0');
}
function render(ms) { const t = fmt(ms); if (t !== lastText) { display.textContent = t; lastText = t; } }

function frame() {
  const now = Date.now();
  sampleSync(now);
  if (state === 'countdown') {
    const n = String(Math.max(1, Math.min(3, 3 - Math.floor((now - audioZero) / 1000))));
    if (n !== lastCd) { cdEl.textContent = n; lastCd = n; }
    if (now >= runStart()) beginRun();
  }
  if (state === 'running') render(now - runStart());
  if (state === 'countdown' || state === 'running') raf = requestAnimationFrame(frame);
}
function loop() { cancelAnimationFrame(raf); winMin = Infinity; winStart = Date.now(); raf = requestAnimationFrame(frame); }

function startCountdown() {
  if (!pack) return;
  if (runUrlFor !== interval) prebuild();
  setState('countdown');
  hint.textContent = UI.tapToCancel;
  cdEl.textContent = lastCd = '3';
  audioZero = Date.now(); syncSamples = 0;
  setMedia();
  playFile(runUrl, 'run', 0, null);           // play() inside the tap unlocks audio on iOS
  loop();
}

function beginRun() {
  setState('running');
  hint.textContent = UI.tapToStop;
  lastText = ''; needsResume = false;
  saveRun();
}
function saveRun() { store.set('run', { state: 'running', zero: audioZero, interval }); }
setInterval(() => { if (state === 'running') saveRun(); }, 5000);

function stop() {
  if (state === 'countdown') { reset(); return; }
  if (state !== 'running') return;
  const elapsed = Date.now() - runStart();
  cancelAnimationFrame(raf);
  setState('stopped');
  stoppedAt = performance.now();
  render(elapsed);
  hint.textContent = '';
  store.set('run', { state: 'stopped', elapsed });
  const ids = finalIds(Math.floor(elapsed / 1000));
  playFile(buildMp3(0.3, [{ at: SHIFT * FS, ids }]), 'final', 0, null);
}

function reset() {
  cancelAnimationFrame(raf);
  setState('idle');
  fileKind = null; player.pause(); clearMedia();
  lastText = ''; display.textContent = '00:00.00';
  startBtn.disabled = !pack;
  store.set('run', null);
}

/* ---------------- Input ---------------- */
startBtn.addEventListener('click', startCountdown);
$('tapZone').addEventListener('pointerdown', e => {
  if (needsResume) return;            // resume needs a full tap (click) for iOS to allow audio
  e.preventDefault();
  stop();
});
$('tapZone').addEventListener('click', () => {
  if (!needsResume || !pack) return;
  needsResume = false; hint.textContent = UI.tapToStop;
  setMedia();
  resumeAudio();
});
function resumeAudio() {
  const t = audioNow();
  let from = 0;
  if (t >= FILE_SEC + 3) from = 3 + FILE_SEC + Math.floor((t - 3 - FILE_SEC) / FILE_SEC) * FILE_SEC;
  const url = from === 0 ? (runUrlFor === interval ? runUrl : (prebuild(), runUrl)) : buildRunFile(from);
  playFile(url, 'run', from, t - from);
  loop();
}
$('resetBtn').addEventListener('click', () => {
  if (performance.now() - stoppedAt < 600) return;   // ignore the click left over from the stop tap
  reset();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state === 'running' && player.paused && !needsResume) player.play().catch(() => {});
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------------- Restore after the app was closed/killed ---------------- */
(function restore() {
  const r = store.get('run', null);
  if (!r) return;
  if (r.state === 'running' && r.zero) {
    audioZero = r.zero;
    if (INTERVALS.includes(r.interval)) interval = r.interval;
    setState('running');
    needsResume = true; hint.textContent = UI.tapToResume;
    loop();
  } else if (r.state === 'stopped') {
    setState('stopped'); render(r.elapsed);
  }
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
