<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="סטופר">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>סטופר</title>
<style>
  :root {
    --bg: #000; --fg: #fff; --dim: #8e8e93;
    --red: #ff453a; --red-bg: #330e0c;
    --gray-bg: #333336;
    --wine-1: #7f2a3b; --wine-2: #5c1a28; --wine-3: #3a0d17; --wine-text: #fde6ea;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
  }
  body {
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7vh; position: relative; padding: 0 16px; }

  #display {
    direction: ltr; font-weight: 200; font-variant-numeric: tabular-nums; font-feature-settings: "tnum";
    font-size: min(20vw, 34vh, 130px); letter-spacing: -0.02em; line-height: 1; white-space: nowrap;
  }
  #countdown { font-weight: 200; font-variant-numeric: tabular-nums; font-size: min(60vw, 50vh); line-height: 1; }
  #hint { color: var(--dim); font-size: 17px; min-height: 1.3em; text-align: center; justify-content: center; }

  /* iOS-style round buttons (fill, black gap, outer ring) */
  .btn {
    --c: var(--fg); --b: var(--gray-bg);
    width: 96px; height: 96px; border-radius: 50%; border: 0;
    background: var(--b); color: var(--c);
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--b);
    font: inherit; font-size: 18px; font-weight: 400; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .btn:active { opacity: .7; }
  .btn.red  { --c: var(--red); --b: var(--red-bg); }
  .btn.gray { --c: #fff; --b: var(--gray-bg); }

  /* Big Start button: soft bordeaux with depth, SF Pro Rounded (Apple Fitness style) */
  #startBtn {
    --size: min(70vw, 42vh, 300px);
    width: var(--size); height: var(--size); border-radius: 50%; border: 0; cursor: pointer;
    align-items: center; justify-content: center;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, "SF Pro Display", system-ui, sans-serif;
    font-size: calc(var(--size) * 0.18); font-weight: 600; letter-spacing: 0.01em; color: var(--wine-text);
    background:
      radial-gradient(circle at 50% 22%, rgba(255,255,255,.16), rgba(255,255,255,0) 45%),
      radial-gradient(circle at 50% 40%, var(--wine-1) 0%, var(--wine-2) 58%, var(--wine-3) 100%);
    box-shadow:
      inset 0 2px 1px rgba(255,255,255,.22),
      inset 0 -10px 24px rgba(0,0,0,.45),
      0 0 0 6px #000,
      0 0 0 8px rgba(154,52,72,.55),
      0 24px 60px rgba(154,52,72,.28),
      0 10px 24px rgba(0,0,0,.6);
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
    transition: transform .12s ease, filter .12s ease;
  }
  #startBtn:active { transform: scale(.965); filter: brightness(.92); }
  #startBtn[disabled] { opacity: .5; }

  /* Settings (idle screen) */
  #settings { position: absolute; bottom: 20px; left: 16px; right: 16px; flex-direction: column; gap: 14px; align-items: center; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; max-width: 360px; color: var(--dim); font-size: 15px; }
  .seg { display: flex; background: #1c1c1e; border-radius: 9px; padding: 2px; direction: ltr; }
  .seg button {
    border: 0; background: transparent; color: #fff; font: inherit; font-size: 14px; font-variant-numeric: tabular-nums;
    min-width: 50px; padding: 6px 10px; border-radius: 7px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: #636366; box-shadow: 0 3px 8px rgba(0,0,0,.25); }

  #tapZone { position: fixed; inset: 0; z-index: 10; display: none; }

  /* State-driven visibility */
  .v { display: none !important; }
  body[data-state="idle"] .v-idle,
  body[data-state="countdown"] .v-countdown,
  body[data-state="running"] .v-running,
  body[data-state="stopped"] .v-stopped { display: flex !important; }
  body[data-state="countdown"] #tapZone, body[data-state="running"] #tapZone { display: block; }
</style>
</head>
<body data-state="idle">
<main>
  <div id="countdown" class="v v-countdown">3</div>
  <div id="display" class="v v-running v-stopped">00:00.00</div>
  <button id="startBtn" class="v v-idle" lang="en" disabled>Start</button>
  <button id="stopBtn" class="btn red v v-running v-countdown" lang="en" tabindex="-1">Stop</button>
  <button id="resetBtn" class="btn gray v v-stopped" lang="en">Reset</button>
  <div id="hint" class="v v-running v-countdown v-stopped"></div>
  <div id="settings" class="v v-idle">
    <div class="row"><span>הקראת זמן כל (שניות)</span><div class="seg" id="intervalSeg"></div></div>
  </div>
</main>
<div id="tapZone"></div>

<script>
/* ===================================================================
   Audio design (why it is on time and keeps going when the screen locks)
   - Spoken clips are pre-recorded (voice/*.mp3, made by tools/make_voice.py)
     and decoded to PCM once at load.
   - Playback is one <audio> element playing a chain of WAV "segments" built
     in JS. Each segment already contains its callout at the exact sample
     offset, so the speech is sample-accurate inside the segment.
   - Segments switch LEAD seconds *before* each callout (during silence), so
     the file-switch latency never delays speech; on each switch we seek to
     correct for that latency against the wall clock.
   - iOS keeps an <audio> element playing when the screen locks, and its
     'ended' events keep firing, so the chain continues in a pocket.
   Texts/language live in tools/make_voice.py; here we only pick clip ids.
   =================================================================== */
const INTERVALS = [5, 10, 30, 60];
const MAX_MIN = 90;
const RATE = 24000;          // sample rate of generated segments
const LEAD = 0.8;            // seconds of silence before each callout inside its segment
const UI = {
  tapToStop: 'הקש בכל מקום כדי לעצור',
  tapToCancel: 'הקש כדי לבטל',
  tapToResume: 'הקש כדי לחדש את ההקראות',
  loading: 'טוען…',
  nowPlaying: 'סטופר רץ',
  lockHint: 'עצירה = הקראת הזמן',
};
function calloutIds(t) {            // t = seconds since "מתחילים"
  if (t === 0) return ['go'];
  const m = Math.floor(t / 60), s = t % 60;
  if (m === 0) return ['n' + s];
  if (m > MAX_MIN) return [];
  return s ? ['m' + m, 'a' + s] : ['m' + m];
}
function finalIds(t) {              // t = whole seconds
  const m = Math.floor(t / 60), s = t % 60;
  if (m === 0 || m > MAX_MIN) return s ? ['s' + s] : ['zero'];
  return s ? ['m' + m, 'as' + s] : ['m' + m];
}

/* ---------------- Storage ---------------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let interval = store.get('interval', 10); if (!INTERVALS.includes(interval)) interval = 10;

/* ---------------- Elements ---------------- */
const $ = id => document.getElementById(id);
const body = document.body, display = $('display'), cdEl = $('countdown'), hint = $('hint'), startBtn = $('startBtn');
const seg = $('intervalSeg');
function renderSeg() {
  seg.innerHTML = '';
  for (const v of INTERVALS) {
    const b = document.createElement('button');
    b.textContent = String(v);
    b.setAttribute('aria-pressed', String(v === interval));
    b.addEventListener('click', () => { interval = v; store.set('interval', v); renderSeg(); });
    seg.appendChild(b);
  }
}
renderSeg();

/* ---------------- Clips: load + decode to PCM ---------------- */
const pcm = {};                     // id -> Float32Array @ RATE
let clipsReady = false;
(async function loadClips() {
  try {
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const ctx = new OAC(1, 1, RATE);
    const ids = await (await fetch('voice/clips.json')).json();
    await Promise.all(ids.map(async id => {
      try {
        const buf = await (await fetch('voice/' + id + '.mp3')).arrayBuffer();
        const ab = await new Promise((res, rej) => { const p = ctx.decodeAudioData(buf, res, rej); if (p && p.then) p.then(res, rej); });
        pcm[id] = ab.getChannelData(0).slice();
      } catch (e) {}
    }));
  } catch (e) {}
  // beep: 1 kHz, 150 ms, soft edges
  const n = Math.round(0.15 * RATE), b = new Float32Array(n);
  for (let i = 0; i < n; i++) { const env = Math.min(1, i / 120, (n - i) / 600); b[i] = 0.55 * env * Math.sin(2 * Math.PI * 1000 * i / RATE); }
  pcm.beep = b;
  clipsReady = true;
  if (state === 'idle') startBtn.disabled = false;
})();

/* Build a WAV blob URL: `seconds` long, with clip sequences placed at given offsets. */
let lastUrl = null;
function buildWav(seconds, events) {           // events: [{at: sec, ids: [...]}]
  const len = Math.max(1, Math.round(seconds * RATE));
  const data = new Int16Array(len);
  for (const ev of events) {
    let pos = Math.round(ev.at * RATE);
    for (const id of ev.ids) {
      const c = pcm[id]; if (!c) continue;
      for (let i = 0; i < c.length && pos + i < len; i++) {
        const v = Math.max(-1, Math.min(1, c[i] + data[pos + i] / 32768));
        data[pos + i] = v * 32767;
      }
      pos += c.length + Math.round(0.03 * RATE);
    }
  }
  const h = new DataView(new ArrayBuffer(44));
  const w = (o, s) => { for (let i = 0; i < 4; i++) h.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); h.setUint32(4, 36 + len * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  h.setUint32(16, 16, true); h.setUint16(20, 1, true); h.setUint16(22, 1, true);
  h.setUint32(24, RATE, true); h.setUint32(28, RATE * 2, true); h.setUint16(32, 2, true); h.setUint16(34, 16, true);
  w(36, 'data'); h.setUint32(40, len * 2, true);
  if (lastUrl) setTimeout(URL.revokeObjectURL.bind(URL, lastUrl), 5000);
  return (lastUrl = URL.createObjectURL(new Blob([h, data], { type: 'audio/wav' })));
}

/* ---------------- Player: chain of segments ---------------- */
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
const player = new Audio();
player.preload = 'auto';
player.setAttribute('playsinline', '');
let segStartWall = 0;     // wall-clock ms at which the current segment's t=0 should be
let segEndWall = 0;       // wall-clock ms at which the current segment ends (= next segment's start)
let segKind = null;       // 'countdown' | 'run' | 'final'
let seekPending = false, needsResume = false;

function playSeg(url, kind, startWall, endWall, seek) {
  segKind = kind; segStartWall = startWall; segEndWall = endWall; seekPending = seek;
  player.src = url;
  const p = player.play();
  if (p) p.catch(err => { if (err && err.name === 'NotAllowedError' && state === 'running') { needsResume = true; hint.textContent = UI.tapToResume; } });
}
// Correct for load latency: jump to where the wall clock says we should be (never past the callout).
player.addEventListener('loadedmetadata', () => {
  if (!seekPending) return;
  seekPending = false;
  const off = (Date.now() - segStartWall) / 1000;
  if (off > 0.02) try { player.currentTime = Math.min(off, LEAD - 0.05); } catch (e) {}
});
// Fine sync once audio is really flowing (currentTime is reliable only after playback starts):
// - countdown: move the clock to match the audio (beeps / "מתחילים" define 0:00)
// - run: nudge the audio to match the clock, while still in the silent lead-in
let fixes = 0;
player.addEventListener('playing', () => { fixes = 0; });
player.addEventListener('timeupdate', () => {
  const ct = player.currentTime, now = Date.now();
  if (segKind === 'countdown' && state === 'countdown' && ct > 0.15 && ct < 2.8) {
    cdStart = now - ct * 1000;
    runStart = cdStart + 3000;
    segEndWall = runStart + interval * 1000 - LEAD * 1000;
    cdSynced = true;
  } else if (segKind === 'run' && ct > 0.1 && ct < LEAD - 0.15 && fixes < 3) {
    const drift = (now - segStartWall) / 1000 - ct;           // >0: audio is behind the clock
    if (Math.abs(drift) > 0.025) { fixes++; try { player.currentTime = Math.min(ct + drift, LEAD - 0.05); } catch (e) {} }
  }
});
player.addEventListener('ended', onSegEnded);
player.addEventListener('error', () => { if (state === 'running' || state === 'countdown') setTimeout(onSegEnded, 50); });

/* Segment covering [startWall, endWall) of the run, with every callout inside it. */
function runSegment(startWall, endWall) {
  const I = interval * 1000, events = [];
  for (let k = Math.ceil((startWall - runStart) / I); runStart + k * I < endWall; k++) {
    if (k < 1) continue;
    events.push({ at: (runStart + k * I - startWall) / 1000, ids: calloutIds(k * interval) });
  }
  return buildWav((endWall - startWall) / 1000, events);
}
function nextBoundary(after) {      // first segment boundary (callout − LEAD) after `after`
  const I = interval * 1000;
  const k = Math.max(1, Math.floor((after - runStart + LEAD * 1000) / I) + 1);
  return runStart + k * I - LEAD * 1000;
}
function onSegEnded() {
  if (state === 'countdown') { beginRun(); }
  if (state === 'running') {
    let start = segEndWall;
    if (Date.now() - start > LEAD * 1000) start = Date.now();       // fell far behind (e.g. was interrupted)
    const end = nextBoundary(start + 50);
    playSeg(runSegment(start, end), 'run', start, end, true);
    return;
  }
  if (segKind === 'final' || state === 'idle') { player.pause(); clearMedia(); }
}

/* ---------------- Lock-screen controls ---------------- */
function setMedia() {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: UI.nowPlaying, artist: UI.lockHint,
      artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }],
    });
    navigator.mediaSession.setActionHandler('pause', () => stop());
    navigator.mediaSession.setActionHandler('play', () => { player.play().catch(() => {}); });
    try { navigator.mediaSession.setActionHandler('stop', () => stop()); } catch (e) {}
    for (const a of ['seekbackward', 'seekforward', 'previoustrack', 'nexttrack']) try { navigator.mediaSession.setActionHandler(a, null); } catch (e) {}
  } catch (e) {}
}
function clearMedia() { try { if ('mediaSession' in navigator) navigator.mediaSession.metadata = null; } catch (e) {} }

/* ---------------- Timer state machine (wall clock) ---------------- */
let state = 'idle';
let raf = 0, cdStart = 0, cdSynced = false, runStart = 0, stoppedAt = 0, lastText = '';
function setState(s) { state = s; body.dataset.state = s; }

function fmt(ms) {
  const cs = Math.floor(Math.max(0, ms) / 10);
  const m = Math.floor(cs / 6000), s = Math.floor(cs / 100) % 60, c = cs % 100;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + String(c).padStart(2, '0');
}
function render(ms) { const t = fmt(ms); if (t !== lastText) { display.textContent = t; lastText = t; } }

function frame() {
  const now = Date.now();
  if (state === 'countdown') {
    const left = 3 - Math.floor((now - cdStart) / 1000);
    cdEl.textContent = String(Math.max(1, Math.min(3, left)));
    if (cdSynced && now >= runStart) beginRun();       // visual switch even if 'ended' is late
  }
  if (state === 'running') render(now - runStart);
  if (state === 'countdown' || state === 'running') raf = requestAnimationFrame(frame);
}
function loop() { cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); }

function startCountdown() {
  if (!clipsReady) return;
  setState('countdown');
  hint.textContent = UI.tapToCancel;
  cdEl.textContent = '3';
  cdStart = Date.now(); cdSynced = false;
  runStart = cdStart + 3000;
  // beeps at 0,1,2 s → "מתחילים" at 3 s (=0:00) → silence until LEAD before the first callout
  const end = 3 + interval - LEAD;
  const url = buildWav(end, [{ at: 0, ids: ['beep'] }, { at: 1, ids: ['beep'] }, { at: 2, ids: ['beep'] }, { at: 3, ids: ['go'] }]);
  setMedia();
  playSeg(url, 'countdown', cdStart, runStart + interval * 1000 - LEAD * 1000, false);   // play() inside the tap unlocks audio
  loop();
}

function beginRun() {
  if (state !== 'countdown') return;
  setState('running');
  hint.textContent = UI.tapToStop;
  lastText = ''; needsResume = false;
  store.set('run', { state: 'running', start: runStart, interval });
  render(Date.now() - runStart);
}

function stop() {
  if (state === 'countdown') { reset(); return; }
  if (state !== 'running') return;
  const elapsed = Date.now() - runStart;
  cancelAnimationFrame(raf);
  setState('stopped');
  stoppedAt = performance.now();
  render(elapsed);
  hint.textContent = '';
  store.set('run', { state: 'stopped', elapsed });
  const url = buildWav(4, [{ at: 0, ids: finalIds(Math.floor(elapsed / 1000)) }]);
  playSeg(url, 'final', Date.now(), Date.now() + 4000, false);
}

function reset() {
  cancelAnimationFrame(raf);
  setState('idle');
  segKind = null; player.pause(); clearMedia();
  lastText = ''; display.textContent = '00:00.00';
  startBtn.disabled = !clipsReady;
  store.set('run', null);
}

/* ---------------- Input ---------------- */
startBtn.addEventListener('click', startCountdown);
$('tapZone').addEventListener('pointerdown', e => {
  if (needsResume) return;            // resume needs a full tap (click) for iOS to allow audio
  e.preventDefault();
  stop();
});
$('tapZone').addEventListener('click', () => {
  if (!needsResume || !clipsReady) return;
  needsResume = false; hint.textContent = UI.tapToStop;
  setMedia();
  const start = Date.now(), end = nextBoundary(start + 50);
  playSeg(runSegment(start, end), 'run', start, end, true);
});
$('resetBtn').addEventListener('click', () => {
  if (performance.now() - stoppedAt < 600) return;   // ignore the click left over from the stop tap
  reset();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (state === 'running') && player.paused && !needsResume) onSegEnded();
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------------- Restore after the app was closed/killed ---------------- */
(function restore() {
  const r = store.get('run', null);
  if (!r) return;
  if (r.state === 'running') {
    runStart = r.start;
    if (INTERVALS.includes(r.interval)) interval = r.interval;
    setState('running');
    needsResume = true; hint.textContent = UI.tapToResume;
    loop();
  } else if (r.state === 'stopped') {
    setState('stopped'); render(r.elapsed);
  }
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
