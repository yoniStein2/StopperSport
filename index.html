<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="סטופר">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>סטופר</title>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: #8e8e93;
    --green: #30d158;  --green-bg: #0a2a12;
    --red: #ff453a;    --red-bg: #330e0c;
    --gray-fg: #fff;   --gray-bg: #333336;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
  }
  body {
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8vh; position: relative; }

  /* ---- Display ---- */
  #display {
    direction: ltr; font-weight: 200; font-variant-numeric: tabular-nums; font-feature-settings: "tnum";
    font-size: min(20vw, 34vh, 130px); letter-spacing: -0.02em; line-height: 1; white-space: nowrap;
  }
  #countdown { font-weight: 200; font-variant-numeric: tabular-nums; font-size: min(60vw, 50vh); line-height: 1; }
  #hint { color: var(--dim); font-size: 17px; min-height: 1.3em; text-align: center; padding: 0 16px; }

  /* ---- iOS-style round buttons (fill, black gap, outer ring) ---- */
  .btn {
    --c: var(--fg); --b: var(--gray-bg);
    width: 96px; height: 96px; border-radius: 50%; border: 0;
    background: var(--b); color: var(--c);
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--b);
    font: inherit; font-size: 19px; font-weight: 400; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .1s;
  }
  .btn:active { opacity: .7; }
  .btn.green { --c: var(--green); --b: var(--green-bg); }
  .btn.red   { --c: var(--red);   --b: var(--red-bg); }
  .btn.gray  { --c: var(--gray-fg); --b: var(--gray-bg); }
  #startBtn { width: min(72vw, 46vh, 320px); height: min(72vw, 46vh, 320px); font-size: min(11vw, 46px); box-shadow: 0 0 0 5px var(--bg), 0 0 0 8px var(--b); }

  /* ---- Beep toggle ---- */
  #beepToggle {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px; color: var(--dim); font-size: 17px;
  }
  .switch { width: 51px; height: 31px; border-radius: 16px; background: #39393d; position: relative; transition: background .2s; border: 0; padding: 0; }
  .switch::after { content: ""; position: absolute; top: 2px; right: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 2px 4px rgba(0,0,0,.3); }
  .switch[aria-checked="true"] { background: var(--green); }
  .switch[aria-checked="true"]::after { transform: translateX(-20px); }

  /* Full-screen hit area for stopping */
  #tapZone { position: fixed; inset: 0; z-index: 10; display: none; }

  /* ---- State-driven visibility ---- */
  [data-show] { display: none !important; }
  body[data-state="idle"]      [data-show~="idle"],
  body[data-state="countdown"] [data-show~="countdown"],
  body[data-state="running"]   [data-show~="running"],
  body[data-state="stopped"]   [data-show~="stopped"] { display: flex !important; }
  body[data-state="countdown"] #tapZone, body[data-state="running"] #tapZone { display: block; }
  #display[data-show], #countdown[data-show], #hint[data-show] { display: none !important; }
  body[data-state="running"] #display, body[data-state="stopped"] #display,
  body[data-state="countdown"] #countdown,
  body[data-state="running"] #hint, body[data-state="countdown"] #hint, body[data-state="stopped"] #hint { display: block !important; }
</style>
</head>
<body data-state="idle">
<main>
  <div id="countdown" data-show="countdown">3</div>
  <div id="display" data-show="running stopped">00:00.00</div>
  <button id="startBtn" class="btn green" data-show="idle"></button>
  <button id="stopBtn"  class="btn red"   data-show="running countdown" tabindex="-1"></button>
  <button id="resetBtn" class="btn gray"  data-show="stopped"></button>
  <div id="hint" data-show="running countdown stopped"></div>
  <div id="beepToggle" data-show="idle">
    <span id="beepLabel"></span>
    <button id="beepSwitch" class="switch" role="switch" aria-checked="true"></button>
  </div>
</main>
<div id="tapZone"></div>

<script>
/* =====================================================================
   CONFIG — all language-specific text and phrase building lives here.
   To change language: edit lang + words + the two builder functions.
   ===================================================================== */
const CONFIG = {
  lang: 'he-IL',
  voicePrefix: 'he',          // matches voice.lang "he-IL" / "he_IL"
  rate: 1.0,
  countdown: ['שלוש', 'שתיים', 'אחת'],
  go: 'מתחילים!',
  ui: {
    start: 'התחל', stop: 'עצור', reset: 'איפוס',
    tapToStop: 'הקש בכל מקום כדי לעצור',
    tapToCancel: 'הקש כדי לבטל',
    stopped: 'עצרת',
    beep: 'צפצוף עם כל הקראה',
  },
  // feminine cardinals (used for seconds and minutes)
  ones: ['', 'אחת', 'שתיים', 'שלוש', 'ארבע', 'חמש', 'שש', 'שבע', 'שמונה', 'תשע', 'עשר',
         'אחת עשרה', 'שתים עשרה', 'שלוש עשרה', 'ארבע עשרה', 'חמש עשרה', 'שש עשרה',
         'שבע עשרה', 'שמונה עשרה', 'תשע עשרה'],
  tens: ['', 'עשר', 'עשרים', 'שלושים', 'ארבעים', 'חמישים'],
  and: 'ו',

  num(n) {
    if (n < 20) return this.ones[n];
    if (n < 60) { const t = Math.floor(n / 10), o = n % 10; return this.tens[t] + (o ? ' ' + this.and + this.ones[o] : ''); }
    return String(n);
  },
  minutes(m) {
    if (m === 1) return 'דקה';
    if (m === 2) return 'שתי דקות';
    return this.num(m) + ' דקות';
  },
  seconds(s) {
    if (s === 1) return 'שנייה אחת';
    if (s === 2) return 'שתי שניות';
    return this.num(s) + ' שניות';
  },
  /** Callout every 10 s: 10 → "עשר", 70 → "דקה ועשר", 120 → "שתי דקות" */
  callout(totalSec) {
    const m = Math.floor(totalSec / 60), s = totalSec % 60;
    if (m === 0) return this.tens[s / 10];
    return this.minutes(m) + (s ? ' ' + this.and + this.tens[s / 10] : '');
  },
  /** Final time: 97 → "דקה ושלושים ושבע שניות" */
  finalTime(totalSec) {
    const m = Math.floor(totalSec / 60), s = totalSec % 60;
    if (m === 0) return s ? this.seconds(s) : 'אפס שניות';
    if (s === 0) return this.minutes(m);
    return this.minutes(m) + ' ' + this.and + this.seconds(s);
  },
};

/* ---------------- Elements ---------------- */
const $ = id => document.getElementById(id);
const body = document.body, display = $('display'), cdEl = $('countdown'), hint = $('hint');
$('startBtn').textContent = CONFIG.ui.start;
$('stopBtn').textContent  = CONFIG.ui.stop;
$('resetBtn').textContent = CONFIG.ui.reset;
$('beepLabel').textContent = CONFIG.ui.beep;

/* ---------------- Speech ---------------- */
const synth = window.speechSynthesis;
let voice = null, speechPrimed = false;
function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices();
  const he = vs.filter(v => v.lang && v.lang.replace('_', '-').toLowerCase().startsWith(CONFIG.voicePrefix));
  voice = he.find(v => v.localService) || he[0] || null;
}
if (synth) { pickVoice(); synth.addEventListener?.('voiceschanged', pickVoice); }

function speak(text, { interrupt = true } = {}) {
  if (!synth || !text) return;
  if (interrupt && (synth.speaking || synth.pending)) synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = CONFIG.lang;
  if (voice) u.voice = voice;
  u.rate = CONFIG.rate;
  synth.speak(u);
}
// iOS: speech must be unlocked by a user gesture — speak a silent utterance once.
function primeSpeech() {
  if (speechPrimed || !synth) return;
  speechPrimed = true;
  const u = new SpeechSynthesisUtterance(' ');
  u.volume = 0; u.lang = CONFIG.lang;
  synth.speak(u);
  if (!voice) pickVoice();
}

/* ---------------- Beep (Web Audio) ---------------- */
let actx = null;
let beepOn = true;
try { beepOn = localStorage.getItem('beep') !== '0'; } catch (e) {}
function unlockAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
  if (actx && actx.state === 'suspended') actx.resume();
}
function beep(freq = 880, dur = 0.12) {
  if (!beepOn || !actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const beepSwitch = $('beepSwitch');
function renderBeep() { beepSwitch.setAttribute('aria-checked', String(beepOn)); }
renderBeep();
beepSwitch.addEventListener('click', () => {
  beepOn = !beepOn; renderBeep();
  try { localStorage.setItem('beep', beepOn ? '1' : '0'); } catch (e) {}
  unlockAudio(); beep();
});

/* ---------------- Wake Lock ---------------- */
let wakeLock = null;
async function lockOn() {
  if (!('wakeLock' in navigator) || wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (e) { wakeLock = null; }
}
async function lockOff() {
  const wl = wakeLock; wakeLock = null;
  try { if (wl) await wl.release(); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (state === 'countdown' || state === 'running')) lockOn();
});

/* ---------------- Timer state machine ---------------- */
let state = 'idle';
let raf = 0, cdStart = 0, cdShown = -1, runStart = 0, lastK = 0, stoppedAt = 0, lastText = '';

function setState(s) { state = s; body.dataset.state = s; }

function fmt(ms) {
  const cs = Math.floor(ms / 10);
  const m = Math.floor(cs / 6000), s = Math.floor(cs / 100) % 60, c = cs % 100;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + String(c).padStart(2, '0');
}
function render(ms) {
  const t = fmt(ms);
  if (t !== lastText) { display.textContent = t; lastText = t; }
}

function frame(now) {
  if (state === 'countdown') {
    const el = now - cdStart;
    if (el >= 3000) {
      beginRun(cdStart + 3000);
    } else {
      const idx = Math.floor(el / 1000);
      if (idx !== cdShown) {
        cdShown = idx;
        cdEl.textContent = String(3 - idx);
        speak(CONFIG.countdown[idx]); beep(660);
      }
    }
  }
  if (state === 'running') {
    const elapsed = now - runStart;
    render(elapsed);
    const k = Math.floor(elapsed / 10000);
    if (k > lastK) {            // fire once per 10 s boundary; if several were skipped (backgrounded), say only the latest
      lastK = k;
      speak(CONFIG.callout(k * 10)); beep(880);
    }
  }
  if (state === 'countdown' || state === 'running') raf = requestAnimationFrame(frame);
}

function startCountdown() {
  primeSpeech(); unlockAudio(); lockOn();
  setState('countdown');
  hint.textContent = CONFIG.ui.tapToCancel;
  cdStart = performance.now();
  cdShown = 0;
  cdEl.textContent = '3';
  speak(CONFIG.countdown[0]); beep(660);   // spoken inside the gesture → reliable on iOS
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(frame);
}

function beginRun(t0) {
  setState('running');
  hint.textContent = CONFIG.ui.tapToStop;
  runStart = t0; lastK = 0; lastText = '';
  render(performance.now() - runStart);
  speak(CONFIG.go); beep(1320, 0.25);
}

function stop() {
  const now = performance.now();
  cancelAnimationFrame(raf);
  if (state === 'countdown') { if (synth) synth.cancel(); lockOff(); reset(); return; }
  if (state !== 'running') return;
  const elapsed = now - runStart;
  setState('stopped');
  stoppedAt = now;
  render(elapsed);
  hint.textContent = CONFIG.ui.stopped;
  beep(440, 0.3);
  speak(CONFIG.finalTime(Math.floor(elapsed / 1000)));
  lockOff();
}

function reset() {
  cancelAnimationFrame(raf);
  setState('idle');
  lastText = ''; display.textContent = '00:00.00';
}

/* ---------------- Input ---------------- */
document.addEventListener('pointerdown', primeSpeech, { once: true, capture: true });
$('startBtn').addEventListener('click', startCountdown);
$('tapZone').addEventListener('pointerdown', e => { e.preventDefault(); stop(); });
$('resetBtn').addEventListener('click', () => {
  if (performance.now() - stoppedAt < 600) return;   // ignore the click left over from the stop tap
  if (synth) synth.cancel();
  reset();
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
</script>
</body>
</html>
