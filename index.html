<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="סטופר">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>סטופר</title>
<style>
  :root {
    --bg: #000; --fg: #fff; --dim: #8e8e93;
    --red: #ff453a; --red-bg: #330e0c;
    --gray-bg: #333336;
    --wine-1: #7f2a3b; --wine-2: #5c1a28; --wine-3: #3a0d17; --wine-text: #fde6ea;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
  }
  body {
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7vh; position: relative; padding: 0 16px; }

  #display {
    direction: ltr; font-weight: 200; font-variant-numeric: tabular-nums; font-feature-settings: "tnum";
    font-size: min(20vw, 34vh, 130px); letter-spacing: -0.02em; line-height: 1; white-space: nowrap;
  }
  #countdown { font-weight: 200; font-variant-numeric: tabular-nums; font-size: min(60vw, 50vh); line-height: 1; }
  #hint { color: var(--dim); font-size: 17px; min-height: 1.3em; text-align: center; }

  /* iOS-style round buttons (fill, black gap, outer ring) */
  .btn {
    --c: var(--fg); --b: var(--gray-bg);
    width: 96px; height: 96px; border-radius: 50%; border: 0;
    background: var(--b); color: var(--c);
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--b);
    font: inherit; font-size: 18px; font-weight: 400; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .btn:active { opacity: .7; }
  .btn.red  { --c: var(--red); --b: var(--red-bg); }
  .btn.gray { --c: #fff; --b: var(--gray-bg); }

  /* Big Start button: soft bordeaux with depth */
  #startBtn {
    --size: min(70vw, 42vh, 300px);
    width: var(--size); height: var(--size); border-radius: 50%; border: 0; cursor: pointer;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    font-size: calc(var(--size) * 0.17); font-weight: 300; letter-spacing: 0.02em; color: var(--wine-text);
    background:
      radial-gradient(circle at 50% 22%, rgba(255,255,255,.16), rgba(255,255,255,0) 45%),
      radial-gradient(circle at 50% 40%, var(--wine-1) 0%, var(--wine-2) 58%, var(--wine-3) 100%);
    box-shadow:
      inset 0 2px 1px rgba(255,255,255,.22),
      inset 0 -10px 24px rgba(0,0,0,.45),
      0 0 0 6px #000,
      0 0 0 8px rgba(154,52,72,.55),
      0 24px 60px rgba(154,52,72,.28),
      0 10px 24px rgba(0,0,0,.6);
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
    transition: transform .12s ease, filter .12s ease;
  }
  #startBtn:active { transform: scale(.965); filter: brightness(.92); }

  /* Settings (idle screen) */
  #settings { position: absolute; bottom: 20px; left: 16px; right: 16px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; max-width: 360px; color: var(--dim); font-size: 15px; }
  .seg { display: flex; background: #1c1c1e; border-radius: 9px; padding: 2px; direction: ltr; }
  .seg button {
    border: 0; background: transparent; color: #fff; font: inherit; font-size: 14px; font-variant-numeric: tabular-nums;
    min-width: 50px; padding: 6px 10px; border-radius: 7px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: #636366; box-shadow: 0 3px 8px rgba(0,0,0,.25); }
  .switch { width: 51px; height: 31px; border-radius: 16px; background: #39393d; position: relative; transition: background .2s; border: 0; padding: 0; flex: none; }
  .switch::after { content: ""; position: absolute; top: 2px; right: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 2px 4px rgba(0,0,0,.3); }
  .switch[aria-checked="true"] { background: #30d158; }
  .switch[aria-checked="true"]::after { transform: translateX(-20px); }

  #tapZone { position: fixed; inset: 0; z-index: 10; display: none; }

  /* State-driven visibility */
  .v { display: none !important; }
  body[data-state="idle"] .v-idle,
  body[data-state="countdown"] .v-countdown,
  body[data-state="running"] .v-running,
  body[data-state="stopped"] .v-stopped { display: flex !important; }
  body[data-state="countdown"] #tapZone, body[data-state="running"] #tapZone { display: block; }
</style>
</head>
<body data-state="idle">
<main>
  <div id="countdown" class="v v-countdown">3</div>
  <div id="display" class="v v-running v-stopped">00:00.00</div>
  <button id="startBtn" class="v v-idle" lang="en" style="align-items:center;justify-content:center">Start</button>
  <button id="stopBtn" class="btn red v v-running v-countdown" lang="en" tabindex="-1">Stop</button>
  <button id="resetBtn" class="btn gray v v-stopped" lang="en">Reset</button>
  <div id="hint" class="v v-running v-countdown v-stopped" style="justify-content:center"></div>
  <div id="settings" class="v v-idle">
    <div class="row"><span>הקראת זמן כל (שניות)</span><div class="seg" id="intervalSeg"></div></div>
    <div class="row"><span>צפצוף לפני כל הקראה</span><button id="beepSwitch" class="switch" role="switch" aria-checked="true"></button></div>
  </div>
</main>
<div id="tapZone"></div>

<script>
/* ===================================================================
   Speech is pre-recorded clips (voice/*.mp3, made by tools/make_voice.py)
   played through one <audio> element as a playlist. iOS keeps an audio
   element playing when the screen locks, so callouts continue in a pocket.
   The texts/language live in tools/make_voice.py; these functions only
   choose which clip ids to play.
   =================================================================== */
const INTERVALS = [5, 10, 30, 60];
const MAX_MIN = 90;
const UI = {
  tapToStop: 'הקש בכל מקום כדי לעצור',
  tapToCancel: 'הקש כדי לבטל',
  tapToResume: 'הקש כדי לחדש את ההקראות',
  stopped: '',
  sec: 'ש׳',
  nowPlaying: 'סטופר רץ',
  lockHint: 'עצירה = הקראת הזמן',
};
function calloutIds(t) {            // t = seconds, multiple of the interval
  const m = Math.floor(t / 60), s = t % 60;
  if (m === 0) return ['n' + s];
  if (m > MAX_MIN) return [];
  return s ? ['m' + m, 'a' + s] : ['m' + m];
}
function finalIds(t) {              // t = whole seconds
  const m = Math.floor(t / 60), s = t % 60;
  if (m === 0 || m > MAX_MIN) return s ? ['s' + s] : ['zero'];
  return s ? ['m' + m, 'as' + s] : ['m' + m];
}

/* ---------------- Storage ---------------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let interval = store.get('interval', 10); if (!INTERVALS.includes(interval)) interval = 10;
let beepOn = store.get('beep', true);

/* ---------------- Elements ---------------- */
const $ = id => document.getElementById(id);
const body = document.body, display = $('display'), cdEl = $('countdown'), hint = $('hint');

const seg = $('intervalSeg');
function renderSeg() {
  seg.innerHTML = '';
  for (const v of INTERVALS) {
    const b = document.createElement('button');
    b.textContent = String(v);
    b.setAttribute('aria-pressed', String(v === interval));
    b.addEventListener('click', () => { interval = v; store.set('interval', v); renderSeg(); });
    seg.appendChild(b);
  }
}
renderSeg();
const beepSwitch = $('beepSwitch');
function renderBeep() { beepSwitch.setAttribute('aria-checked', String(beepOn)); }
renderBeep();
beepSwitch.addEventListener('click', () => { beepOn = !beepOn; store.set('beep', beepOn); renderBeep(); });

/* ---------------- Clips: preload into memory ---------------- */
const clipUrl = {};
fetch('voice/clips.json').then(r => r.json()).then(ids => Promise.all(ids.map(async id => {
  try { const r = await fetch('voice/' + id + '.mp3'); if (r.ok) clipUrl[id] = URL.createObjectURL(await r.blob()); } catch (e) {}
}))).catch(() => {});
const urlOf = id => clipUrl[id] || ('voice/' + id + '.mp3');

/* ---------------- Audio playlist engine ---------------- */
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
const player = new Audio();
player.preload = 'auto';
player.setAttribute('playsinline', '');
let queue = [], current = null, engineOn = false, needsResume = false;

function playId(id) {
  current = id;
  player.src = urlOf(id);
  const p = player.play();
  if (p) p.catch(err => { if (err && err.name === 'NotAllowedError' && state === 'running') { needsResume = true; hint.textContent = UI.tapToResume; } });
}
function next() {
  tick();
  if (queue.length) playId(queue.shift());
  else if (state === 'running' || state === 'countdown') playId('silence');
  else { engineOn = false; current = null; player.pause(); clearMedia(); }
}
player.addEventListener('ended', next);
player.addEventListener('error', () => { if (engineOn) setTimeout(next, 50); });
function startEngine(first) { engineOn = true; setMedia(); queue = []; playId(first); }
const withBeep = (ids, b = 'beep') => (beepOn ? [b, ...ids] : ids);

/* ---------------- Lock-screen controls ---------------- */
function setMedia() {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: UI.nowPlaying, artist: UI.lockHint,
      artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }],
    });
    navigator.mediaSession.setActionHandler('pause', () => stop());
    navigator.mediaSession.setActionHandler('play', () => { if (engineOn) player.play().catch(() => {}); });
    for (const a of ['stop']) try { navigator.mediaSession.setActionHandler(a, () => stop()); } catch (e) {}
    for (const a of ['seekbackward', 'seekforward', 'previoustrack', 'nexttrack']) try { navigator.mediaSession.setActionHandler(a, null); } catch (e) {}
  } catch (e) {}
}
function clearMedia() {
  if (!('mediaSession' in navigator)) return;
  try { navigator.mediaSession.metadata = null; } catch (e) {}
}

/* ---------------- Timer state machine (wall clock, survives sleep) ---------------- */
let state = 'idle';
let raf = 0, cdStart = 0, cdShown = -1, runStart = 0, lastK = 0, stoppedAt = 0, lastText = '';
function setState(s) { state = s; body.dataset.state = s; }

function fmt(ms) {
  const cs = Math.floor(Math.max(0, ms) / 10);
  const m = Math.floor(cs / 6000), s = Math.floor(cs / 100) % 60, c = cs % 100;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + String(c).padStart(2, '0');
}
function render(ms) { const t = fmt(ms); if (t !== lastText) { display.textContent = t; lastText = t; } }

// Called from rAF (foreground) and from every clip end (also when locked).
function tick() {
  const now = Date.now();
  if (state === 'countdown') {
    const idx = Math.floor((now - cdStart) / 1000);
    if (idx >= 3) beginRun(cdStart + 3000);
    else if (idx > cdShown) { cdShown = idx; cdEl.textContent = String(3 - idx); queue.push(...withBeep(['cd' + (3 - idx)])); }
  }
  if (state === 'running') {
    const k = Math.floor((now - runStart) / (interval * 1000));
    if (k > lastK) { lastK = k; queue.push(...withBeep(calloutIds(k * interval))); }
  }
}

function frame() {
  tick();
  if (queue.length && current === 'silence') next();       // speak right away instead of waiting for the silence clip
  if (state === 'running') render(Date.now() - runStart);
  if (state === 'countdown' || state === 'running') raf = requestAnimationFrame(frame);
}
function loop() { cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); }

function startCountdown() {
  setState('countdown');
  hint.textContent = UI.tapToCancel;
  cdStart = Date.now(); cdShown = 0; cdEl.textContent = '3';
  startEngine(beepOn ? 'beep' : 'cd3');                     // first play() inside the tap unlocks audio on iOS
  if (beepOn) queue.push('cd3');
  loop();
}

function beginRun(t0) {
  setState('running');
  hint.textContent = UI.tapToStop;
  runStart = t0; lastK = 0; lastText = ''; needsResume = false;
  store.set('run', { state: 'running', start: runStart, interval });
  render(Date.now() - runStart);
  queue.push(...withBeep(['go'], 'beephi'));
}

function stop() {
  if (state === 'countdown') { reset(); return; }
  if (state !== 'running') return;
  const elapsed = Date.now() - runStart;
  cancelAnimationFrame(raf);
  setState('stopped');
  stoppedAt = performance.now();
  render(elapsed);
  hint.textContent = UI.stopped;
  store.set('run', { state: 'stopped', elapsed });
  queue = withBeep(finalIds(Math.floor(elapsed / 1000)));
  if (engineOn) next(); else { engineOn = true; playId(queue.shift()); }
}

function reset() {
  cancelAnimationFrame(raf);
  setState('idle');
  queue = []; engineOn = false; current = null; player.pause(); clearMedia();
  lastText = ''; display.textContent = '00:00.00';
  store.set('run', null);
}

/* ---------------- Input ---------------- */
$('startBtn').addEventListener('click', startCountdown);
$('tapZone').addEventListener('pointerdown', e => {
  if (needsResume) return;            // resume needs a full tap (click) for iOS to allow audio
  e.preventDefault();
  stop();
});
$('tapZone').addEventListener('click', () => {
  if (!needsResume) return;
  needsResume = false; hint.textContent = UI.tapToStop; startEngine('silence');
});
$('resetBtn').addEventListener('click', () => {
  if (performance.now() - stoppedAt < 600) return;   // ignore the click left over from the stop tap
  reset();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && engineOn && player.paused) player.play().catch(() => {});
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------------- Restore after the app was closed/killed ---------------- */
(function restore() {
  const r = store.get('run', null);
  if (!r) return;
  if (r.state === 'running') {
    runStart = r.start;
    lastK = Math.floor((Date.now() - runStart) / (interval * 1000));
    setState('running');
    needsResume = true; hint.textContent = UI.tapToResume;
    loop();
  } else if (r.state === 'stopped') {
    setState('stopped'); render(r.elapsed); hint.textContent = UI.stopped;
  }
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
